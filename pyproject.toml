[build-system]
requires = ['flit_core>=3.4,<4']
build-backend = 'flit_core.buildapi'

[project]
name = 'aiida_flux_scheduler'
dynamic = ['description', 'version']
authors = [
    {name = 'Nathan Keilbart', email = 'keilbart1@llnl.gov'}
]
readme = 'README.md'
license = {file = 'LICENSE.txt'}
classifiers = [
    'Development Status :: 4 - Beta',
    'Framework :: AiiDA',
    'License :: OSI Approved :: MIT License',
    'Operating System :: POSIX :: Linux',
    'Operating System :: MacOS :: MacOS X',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.12',
    'Topic :: Scientific/Engineering'
]
keywords = ['aiida', 'workflows', 'flux', 'scheduler']
requires-python = '>=3.12'
dependencies = [
    'aiida-core~=2.0',
    'click',
    'numpy'
]

[project.urls]
Homepage = "https://github.com/LLNL/aiida-flux-scheduler"
Repository = "https://github.com/LLNL/aiida-flux-scheduler"
Issues = "https://github.com/LLNL/aiida-flux-scheduler/issues"

[project.scripts]
aiida-flux = "aiida_flux_scheduler.cli:cli"

[project.optional-dependencies]
docs = [
    'sphinx',
    'sphinx-autoapi',
    'sphinx-book-theme',
    'sphinx-click',
    'sphinx-copybutton',
    'myst-parser',
]
pre-commit = [
    'pre-commit',
    'pylint',
]
tests = [
    'pgtest',
    'pytest',
    'pytest-regressions',
]

[project.entry-points.'aiida.schedulers']
"flux" ="aiida_flux_scheduler.flux:FluxScheduler"


[tool.flit.module]
name = 'aiida_flux_scheduler'

[tool.ruff]
target-version = 'py312'
line-length = 88

[tool.ruff.lint]
select = ['E', 'F', 'I']
ignore = ['E501']

[tool.mypy]
python_version = '3.12'
files = ['src']
check_untyped_defs = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ['aiida.*', 'click', 'numpy']
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ['aiida_flux_scheduler.flux']
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ['tests']
